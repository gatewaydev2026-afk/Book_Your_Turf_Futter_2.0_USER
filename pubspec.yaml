name: book_your_turf
description: "A new Flutter project for turf booking with user & owner roles."
publish_to: 'none' # Remove this line if you plan to publish to pub.dev

version: 2.0.4+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  http: ^1.1.0
  geolocator:
  provider: ^6.1.1


  #  uni_links: ^0.5.1
  app_links: ^3.5.1  # or latest
  shared_preferences: ^2.2.2
  get: ^4.7.3
  firebase_core: ^3.6.0

  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^5.0.2
  facebook_app_events: ^0.19.0

  timezone: ^0.9.4
  geocoding:
  device_info_plus: ^10.1.0
  uuid: ^4.3.3

  dio: ^5.3.3

  dartz: ^0.10.1
  package_info_plus: ^9.0.1
  lottie: ^3.3.2
  image_picker:
  url_launcher: ^6.3.2
  flutter_image_compress: ^2.1.0
  flutter_secure_storage:
  razorpay_flutter:
  intl:
  google_fonts: ^8.0.2
  shimmer: ^3.0.0
  flutter_svg: ^2.2.4
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.2
  flutter_rating_bar: ^4.0.1
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  flutter_staggered_animations: ^1.1.0  # F

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/
    - assets/lottie/
    - assets/images/
    - assets/icons/
    - assets/sports/
    - assets/fonts/

  fonts:
    - family: Balloon
      fonts:
        - asset: assets/fonts/balloon.TTF


flutter_native_splash:
  color: "#F5F7F6"
  image: assets/images/byt_logo.png

  android: true
  ios: true

  android_12:
    image: assets/images/byt_logo.png
    icon_background_color: "#F5F7F6"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo_new.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/Logo_new.png"
