# Keep Gradle below the memory available on the build machine. The previous
# 8 GB heap caused the daemon to crash before compilation could complete.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
# Avoid a separate Kotlin daemon retaining the old 8 GB heap configuration.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
